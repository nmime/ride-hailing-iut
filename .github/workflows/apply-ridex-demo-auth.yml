name: Apply RideX demo auth patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ridex-demo-auth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download reviewed patch
        run: |
          curl -fsSL https://ride-hailing.funfiesta.games/ridex-demo-auth.patch -o /tmp/ridex-demo-auth.patch
          echo '4d752d4d2d8602434a12934069c10427db9cb358453db1e10c1ce644468fb3a7  /tmp/ridex-demo-auth.patch' | sha256sum -c -
      - name: Apply patch and remove temporary workflow
        run: |
          git apply --index /tmp/ridex-demo-auth.patch
          git rm .github/workflows/apply-ridex-demo-auth.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): enable secure demo login' -m 'Add server-side seeded demo login, polished accessible auth UI, documentation, and tests.'
          git push origin HEAD:main
