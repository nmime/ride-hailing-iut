name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build all packages
        run: pnpm -r build

      - name: Run unit tests
        run: pnpm -r test

  compose-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build all images via docker compose
        run: docker compose build --pull

  smoke:
    runs-on: ubuntu-latest
    needs: compose-build
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          # Give services up to 90s to be ready
          for i in $(seq 1 18); do
            if curl -fsS http://localhost/healthz; then break; fi
            sleep 5
          done
      - name: Run migrations + seed
        run: |
          docker compose exec -T api node dist/scripts/migrate.js
          docker compose exec -T api node dist/scripts/seed.js
      - name: Export smoke test environment
        run: |
          grep -E '^(RIDEX_SEED_PASSWORD|RIDEX_SMOKE_(RIDER_PHONE|DRIVER_PHONE|ADMIN_PHONE|DRIVER_ID))=' .env >> "$GITHUB_ENV"
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
