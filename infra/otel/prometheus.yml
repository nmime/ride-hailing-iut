global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: redpanda
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: { service: postgres }

  - job_name: ridex-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels: { service: api }

  - job_name: ridex-cron
    static_configs:
      - targets: ['cron:9300']
        labels: { service: cron }
