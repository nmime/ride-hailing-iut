# OpenTelemetry Collector — ingestion point for application traces and OTLP
# metrics. Container logs are shipped to Loki by Promtail.

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  resource:
    attributes:
      - { key: deployment.environment, value: dev, action: upsert }

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls: { insecure: true }

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [resource, batch]
      exporters:  [otlphttp/tempo]

    metrics:
      receivers:  [otlp]
      processors: [resource, batch]
      exporters:  [prometheus]
