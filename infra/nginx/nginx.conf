# RideX API gateway. Single public entrypoint for the whole stack (R8).
# - Routes /api/*    -> api replicas (round-robin load balanced)
# - Routes /ws/*     -> ws-gateway (sticky on the connection level for Socket.IO)
# - Routes /         -> web (React SPA)
# - Health probe at /healthz proxies to api.

worker_processes  auto;
events { worker_connections  1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker's embedded resolver — required so service names can be
    # re-resolved when api containers scale up/down.
    resolver 127.0.0.11 valid=10s;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Round-robin load balancer across the api replicas. Docker DNS resolves
    # `api` to the IPs of every replica created by the compose `replicas` key.
    upstream api_upstream {
        zone api 64k;
        # The single hostname returns multiple A records; nginx LBs across them.
        server api:3000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream web_upstream {
        zone web 32k;
        server web:80 resolve;
        keepalive 8;
    }

    upstream ws_upstream {
        zone ws 32k;
        # Single WS gateway today. Add ip_hash here if/when scaled.
        server ws-gateway:3100 resolve;
    }

    upstream ingestor_upstream {
        zone ingestor 32k;
        server ingestor:3200 resolve;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
