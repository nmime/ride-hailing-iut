server {
    listen 80 default_server;
    server_name _;

    # In production, terminate TLS here. Mount the cert and key, then:
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 4m;

    # Health probe — used by load balancer / uptime monitor
    location = /healthz {
        proxy_pass http://api_upstream/healthz;
        proxy_http_version 1.1;
        access_log off;
    }

    # REST API + Swagger
    location /api/ {
        proxy_pass         http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward W3C trace context so OTel can correlate requests end-to-end
        proxy_set_header   traceparent       $http_traceparent;
        proxy_set_header   tracestate        $http_tracestate;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Driver-side ingest (location pings) — high-volume write path
    location /ingest/ {
        proxy_pass         http://ingestor_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # WebSocket (Socket.IO) — note Upgrade headers
    location /ws/ {
        proxy_pass         http://ws_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "Upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout    300s;
    }

    # Static React SPA (everything else)
    location / {
        proxy_pass         http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
